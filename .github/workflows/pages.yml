name: Validar e publicar KakuniBoys
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preparar arquivos públicos
        shell: bash
        run: |
          mkdir -p _site
          cp -- index.html styles.css site.js kit.js content.js qr.js effects.js clouds.js .nojekyll _site/
          cp -R -- assets vendor _site/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
